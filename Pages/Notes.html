<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Smart Notes</title>

  <!-- GOOGLE FONT -->

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet"
        href="../CSS/Notes.css">

</head>

<body>

  <!-- BACKGROUND EFFECT -->

  <div class="bg-circle one"></div>
  <div class="bg-circle two"></div>

  <!-- MAIN CONTAINER -->

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <h1>Smart Notes 📝</h1>

      <p>
        Organize your study notes beautifully and stay productive.
      </p>

    </div>

    <!-- NOTES SECTION -->

    <div class="notes-box">

      <!-- TITLE -->

      <input
        type="text"
        id="noteTitle"
        placeholder="Enter Note Title..."
      >

      <!-- TEXTAREA -->

      <textarea
        id="note"
        placeholder="Write your study notes here..."
      ></textarea>

      <!-- BUTTONS -->

      <div class="buttons">

        <button onclick="saveNote()">

          💾 Save Note

        </button>

        <button onclick="clearNote()">

          🗑 Clear

        </button>

      </div>

    </div>

    <!-- STATUS -->

    <p id="status">

      Ready To Write 🚀

    </p>

    <!-- SAVED NOTES -->

    <div class="saved-notes">

      <h2>Saved Notes 📚</h2>

      <div id="notesContainer"></div>

    </div>

    <!-- BACK BUTTON -->

    <a href="../index.html"
       class="back-btn">

      ⬅ Back To Home

    </a>

  </div>

  <!-- JS -->

  <script src="../JS/Notes.js"></script>

</body>
</html>
